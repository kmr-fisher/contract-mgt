<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contract MGT</title>
<meta name="description" content="Contract Management App — Fisher's Equipment Limited">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contract MGT">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --acc:#3b82f6;--acc2:#6366f1;--acc-g:linear-gradient(135deg,#3b82f6,#6366f1);--acc-glow:rgba(59,130,246,.35);
  --bg:#0b0f1a;--surf:rgba(18,22,34,.78);--surf2:rgba(255,255,255,.04);--surf3:rgba(255,255,255,.07);
  --txt:#e8eaf0;--txt2:#8892a4;--txt3:#4a5568;--bdr:rgba(255,255,255,.08);--bdr2:rgba(255,255,255,.04);
  --blur:blur(18px) saturate(1.8);--radius:14px;--radius-sm:8px;--radius-lg:20px;
  --trans:150ms cubic-bezier(.4,0,.2,1);--trans-slow:280ms cubic-bezier(.4,0,.2,1);
  --sidebar:240px;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;
  --mesh1:rgba(59,130,246,.12);--mesh2:rgba(99,102,241,.08);--mesh3:rgba(59,130,246,.06);
}
[data-theme=light]{
  --bg:#f0f2f8;--surf:rgba(255,255,255,.85);--surf2:rgba(0,0,0,.03);--surf3:rgba(0,0,0,.06);
  --txt:#1a202c;--txt2:#4a5568;--txt3:#a0aec0;--bdr:rgba(0,0,0,.08);--bdr2:rgba(0,0,0,.04);
  --mesh1:rgba(59,130,246,.08);--mesh2:rgba(99,102,241,.05);--mesh3:rgba(59,130,246,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Arial',Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
#bg-mesh{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bg-mesh::before,#bg-mesh::after{content:'';position:absolute;border-radius:50%;filter:blur(80px)}
#bg-mesh::before{width:600px;height:600px;background:radial-gradient(circle,var(--mesh1) 0%,transparent 70%);top:-100px;left:-100px;animation:meshA 18s ease-in-out infinite alternate}
#bg-mesh::after{width:500px;height:500px;background:radial-gradient(circle,var(--mesh2) 0%,transparent 70%);bottom:-50px;right:-50px;animation:meshB 22s ease-in-out infinite alternate}
@keyframes meshA{to{transform:translate(120px,80px) scale(1.2)}}
@keyframes meshB{to{transform:translate(-100px,-60px) scale(1.1)}}
#app{display:flex;height:100vh;position:relative;z-index:1}
#sidebar{width:var(--sidebar);background:var(--surf);backdrop-filter:var(--blur);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sb-logo{display:flex;align-items:center;gap:10px;padding:20px 16px 16px;border-bottom:1px solid var(--bdr)}
.sb-logo-icon{width:34px;height:34px;background:var(--acc-g);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px var(--acc-glow)}
.sb-logo-text{font-weight:700;font-size:15px;letter-spacing:.3px}
.sb-logo-sub{font-size:10px;color:var(--txt2);margin-top:1px}
.sb-nav{flex:1;overflow-y:auto;padding:10px 0}
.sb-nav::-webkit-scrollbar{width:3px}.sb-nav::-webkit-scrollbar-thumb{background:var(--bdr)}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 14px;margin:1px 8px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--trans);color:var(--txt2);font-size:13px;font-weight:500;user-select:none}
.sb-item:hover{background:var(--surf3);color:var(--txt)}
.sb-item.active{background:var(--acc-g);color:#fff;box-shadow:0 3px 10px var(--acc-glow)}
.sb-item svg{flex-shrink:0;opacity:.8}
.sb-item.active svg{opacity:1}
.sb-acc-header{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 4px 14px;color:var(--txt3);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-top:6px}
.sb-acc-item{display:flex;align-items:center;gap:8px;padding:7px 14px;margin:1px 8px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--trans);font-size:12px;color:var(--txt2)}
.sb-acc-item:hover{background:var(--surf3);color:var(--txt)}
.sb-acc-item.active{background:var(--surf3);color:var(--txt)}
.sb-acc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-acc-bal{margin-left:auto;font-size:11px;font-weight:600;margin-right:4px}
.sb-acc-item:hover .btn-icon{opacity:1!important}
.sb-footer{padding:12px 8px;border-top:1px solid var(--bdr);flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--bdr);background:var(--surf);backdrop-filter:var(--blur);flex-shrink:0}
.topbar-title{font-size:18px;font-weight:700}
.topbar-sub{font-size:12px;color:var(--txt2);margin-top:2px}
.content{flex:1;overflow-y:auto;padding:28px 32px}
.content::-webkit-scrollbar{width:4px}.content::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}
.page{animation:pageIn var(--trans-slow) both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surf);backdrop-filter:var(--blur);border:1px solid var(--bdr);border-radius:var(--radius);padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-amber::before{background:var(--acc-g)}
.stat-green::before{background:linear-gradient(90deg,#22c55e,#16a34a)}
.stat-blue::before{background:linear-gradient(90deg,#3b82f6,#6366f1)}
.stat-red::before{background:linear-gradient(90deg,#ef4444,#f97316)}
.stat-purple::before{background:linear-gradient(90deg,#a855f7,#ec4899)}
.stat-label{font-size:11px;color:var(--txt2);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:700;line-height:1}
.stat-sub{font-size:11px;color:var(--txt2);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:var(--trans);font-family:inherit}
.btn:active{transform:scale(.97)}
.bp{background:var(--acc-g);color:#fff;box-shadow:0 4px 14px var(--acc-glow)}
.bp:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--acc-glow)}
.bs{background:var(--surf3);color:var(--txt);border:1px solid var(--bdr)}
.bs:hover{background:var(--surf2);border-color:rgba(255,255,255,.14)}
.bd{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.25)}
.bd:hover{background:rgba(239,68,68,.25)}
.bg-green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 4px 14px rgba(34,197,94,.3)}
.bg-green:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(34,197,94,.4)}
.btn-icon{padding:7px}
.form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.form-row label{font-size:12px;color:var(--txt2);font-weight:500}
.form-row input,.form-row select,.form-row textarea{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--radius-sm);padding:9px 12px;color:var(--txt);font-size:13px;width:100%;transition:var(--trans);font-family:inherit}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
.form-row textarea{resize:vertical;min-height:70px}
.form-row select option{background:#1a202c;color:#e8eaf0}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#modal-overlay.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;animation:modalIn 220ms cubic-bezier(.34,1.56,.64,1) both}
@media(max-width:640px){#modal-overlay{padding:0;align-items:flex-end}.modal{max-width:100%;max-height:calc(100dvh - 60px);border-radius:var(--radius-lg) var(--radius-lg) 0 0}.modal-body{padding:16px}.modal-header{padding:14px 16px 12px}.modal-footer{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}}
.modal-lg{max-width:680px}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.modal-title{font-size:16px;font-weight:700}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-body::-webkit-scrollbar{width:3px}.modal-body::-webkit-scrollbar-thumb{background:var(--bdr)}
.modal-footer{padding:14px 22px;border-top:1px solid var(--bdr);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0}
#toasts{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;backdrop-filter:blur(16px);border:1px solid;animation:toastIn 200ms ease both;min-width:240px;max-width:340px}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.toast-s{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#4ade80}
.toast-e{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:#f87171}
.toast-i{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.3);color:#93c5fd}
.toast-w{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.3);color:#fcd34d}
.tabs{display:flex;gap:4px;background:var(--surf2);border-radius:var(--radius-sm);padding:3px;border:1px solid var(--bdr)}
.tab{padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--txt2);transition:var(--trans);white-space:nowrap}
.tab.active{background:var(--surf3);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tab-income.active{background:rgba(34,197,94,.2);color:#4ade80}
.tab-expense.active{background:rgba(239,68,68,.2);color:#f87171}
.tab-transfer.active{background:rgba(59,130,246,.2);color:#93c5fd}
.period-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pq-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--bdr);background:transparent;color:var(--txt2);font-size:12px;cursor:pointer;transition:var(--trans);font-weight:500;font-family:inherit}
.pq-btn:hover{border-color:var(--acc);color:var(--acc)}
.pq-btn.active{background:var(--acc-g);border-color:transparent;color:#fff;box-shadow:0 2px 8px var(--acc-glow)}
.month-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.month-tabs::-webkit-scrollbar{height:2px}.month-tabs::-webkit-scrollbar-thumb{background:var(--bdr)}
.month-tab{padding:5px 12px;border-radius:20px;border:1px solid var(--bdr);background:transparent;color:var(--txt2);font-size:12px;cursor:pointer;transition:var(--trans);white-space:nowrap;font-weight:500;font-family:inherit}
.month-tab:hover{border-color:var(--acc);color:var(--acc)}
.month-tab.active{background:var(--acc-g);border-color:transparent;color:#fff}
.summary-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.sum-item{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--radius-sm);padding:12px 16px}
.sum-label{font-size:11px;color:var(--txt2);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.sum-value{font-size:18px;font-weight:700}
.sum-income .sum-value{color:var(--green)}
.sum-expense .sum-value{color:var(--red)}
.tx-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);transition:var(--trans);cursor:pointer;border:1px solid transparent}
.tx-item:hover{background:var(--surf2);border-color:var(--bdr)}
.tx-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--txt2);margin-top:2px}
.tx-amount{font-size:14px;font-weight:700;white-space:nowrap}
.tx-amount.income{color:var(--green)}
.tx-amount.expense{color:var(--red)}
.tx-amount.transfer{color:var(--blue)}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:220px;overflow-y:auto;padding:4px}
.cat-grid::-webkit-scrollbar{width:3px}.cat-grid::-webkit-scrollbar-thumb{background:var(--bdr)}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:var(--radius-sm);cursor:pointer;border:2px solid transparent;transition:var(--trans)}
.cat-opt:hover{background:var(--surf3)}
.cat-opt.selected{border-color:var(--acc);background:var(--surf3)}
.cat-opt-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}.cat-opt-icon svg{width:20px;height:20px}
.icon-opt-svg{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:var(--trans);background:var(--surf3);color:var(--txt2)}.icon-opt-svg:hover{border-color:var(--acc)}.icon-opt-svg.selected{border-color:var(--acc);background:rgba(59,130,246,.15);color:var(--acc)}.icon-opt-svg svg{width:18px;height:18px}
.cat-opt-name{font-size:10px;color:var(--txt2);text-align:center;line-height:1.2;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:var(--trans)}
.color-swatch:hover{transform:scale(1.1)}
.color-swatch.selected{border-color:var(--txt)}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:150px;overflow-y:auto}
.icon-grid::-webkit-scrollbar{width:3px}.icon-grid::-webkit-scrollbar-thumb{background:var(--bdr)}
.icon-opt{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:17px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:var(--trans)}
.icon-opt:hover{background:var(--surf3)}
.icon-opt.selected{border-color:var(--acc);background:var(--surf3)}
.amount-display{text-align:center;padding:12px;background:var(--surf2);border-radius:var(--radius-sm);margin-bottom:14px;border:1px solid var(--bdr)}
.amount-display .alabel{font-size:11px;color:var(--txt2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.amount-display .aval{font-size:36px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
.amount-display.income .aval{color:var(--green)}
.amount-display.expense .aval{color:var(--red)}
.amount-display.transfer .aval{color:var(--blue)}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:15px;font-weight:700}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;color:var(--txt2);text-align:center;gap:8px}
.empty-icon{width:40px;height:40px;opacity:.35;display:flex;align-items:center;justify-content:center}.empty-icon svg{width:40px;height:40px}
.search-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:flex-start;justify-content:center;padding-top:80px}
.search-box{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.search-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bdr)}
.search-input-wrap svg{opacity:.5;flex-shrink:0}
.search-input-wrap input{flex:1;background:none;border:none;outline:none;font-size:16px;color:var(--txt);font-family:inherit}
.search-results{max-height:420px;overflow-y:auto}
.search-group-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);padding:10px 16px 4px}
.search-result{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:background 120ms}
.search-result:hover{background:var(--surf2)}
.search-result-icon{width:32px;height:32px;border-radius:8px;background:var(--surf2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.search-result-name{font-size:13px;font-weight:600;color:var(--txt)}
.search-result-sub{font-size:11px;color:var(--txt3);margin-top:1px}
.search-result-badge{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--surf3);color:var(--txt2);margin-left:auto;flex-shrink:0}
.search-empty{padding:32px 16px;text-align:center;color:var(--txt3);font-size:13px}
.empty-text{font-size:14px;font-weight:500}
.empty-sub{font-size:12px;color:var(--txt3)}
.proj-card{cursor:pointer;transition:var(--trans)}
.proj-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.14)}
.proj-name{font-size:14px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-agency{font-size:11px;color:var(--txt2);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-progress{height:3px;background:var(--surf3);border-radius:2px;margin:8px 0;overflow:hidden}
.proj-progress-bar{height:100%;border-radius:2px;background:var(--acc-g)}
.plan-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surf2);border-radius:var(--radius-sm);border:1px solid var(--bdr);margin-bottom:8px}
.plan-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.plan-info{flex:1;min-width:0}
.plan-name{font-size:13px;font-weight:600}
.plan-meta{font-size:11px;color:var(--txt2);margin-top:2px}
.plan-progress{height:4px;background:var(--surf3);border-radius:2px;margin-top:6px;overflow:hidden}
.plan-progress-bar{height:100%;border-radius:2px}
.toggle{position:relative;display:inline-flex;cursor:pointer;align-items:center;gap:8px}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{width:38px;height:20px;background:var(--surf3);border-radius:10px;border:1px solid var(--bdr);transition:var(--trans);position:relative;flex-shrink:0}
.toggle input:checked+.toggle-track{background:var(--acc);border-color:var(--acc)}
.toggle-track::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:var(--trans)}
.toggle input:checked+.toggle-track::after{left:20px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--bdr2)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:13px;font-weight:500}
.setting-sub{font-size:11px;color:var(--txt2);margin-top:2px}
.theme-opts{display:flex;gap:6px}
.theme-opt{padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--bdr);background:transparent;color:var(--txt2);font-size:12px;cursor:pointer;transition:var(--trans);font-weight:500;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.theme-opt:hover{border-color:var(--acc);color:var(--acc)}
.theme-opt.active{background:var(--acc-g);border-color:transparent;color:#fff}
.confirm-box{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--radius-lg);padding:28px 24px;max-width:380px;text-align:center;animation:modalIn 200ms ease both}
.confirm-icon{font-size:36px;margin-bottom:12px}
.confirm-msg{font-size:14px;color:var(--txt);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px;justify-content:center}
.var-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surf2);border-radius:var(--radius-sm);border:1px solid var(--bdr);margin-bottom:8px}
.var-info{flex:1;min-width:0}

<div id="app">
  <div id="sidebar"></div>
  <div id="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </div>

<div id="toasts"></div>
<script>
const STORE='cpm_v6';
const LOG_STORE='cpm_v6_log';
const MAX_LOG=200;

function logErr(type,msg,detail=''){
  try{
    const entry={ts:new Date().toISOString(),type,msg:String(msg||'').slice(0,300),detail:String(detail||'').slice(0,600)};
    let log=[];try{log=JSON.parse(localStorage.getItem(LOG_STORE)||'[]');}catch(e){}
    log.unshift(entry);
    if(log.length>MAX_LOG)log=log.slice(0,MAX_LOG);
    localStorage.setItem(LOG_STORE,JSON.stringify(log));
  }catch(e){}
}
function getLog(){try{return JSON.parse(localStorage.getItem(LOG_STORE)||'[]');}catch(e){return[];}}
function clearLog(){localStorage.removeItem(LOG_STORE);if(S.view==='settings')renderContent();toast('Log cleared','s');}
function copyLog(){
  const lines=getLog().map(e=>`[${e.ts}] [${e.type}] ${e.msg}${e.detail?'\n  '+e.detail:''}`).join('\n');
  navigator.clipboard.writeText(lines||'(no entries)').then(()=>toast('Copied to clipboard','s')).catch(()=>toast('Copy failed — try a different browser','e'));
}

window.onerror=function(msg,src,line,col,err){
  logErr('CRASH',msg,(src?src+':'+line+':'+col:'')+(err&&err.stack?'\n'+err.stack:''));
  return false;
};
window.addEventListener('unhandledrejection',e=>{
  logErr('PROMISE',e.reason?.message||String(e.reason||''),e.reason?.stack||'');
});

// PIN PROTECTION
let _pinAction=null;

function hashStr(s){
  // FNV-1a 32-bit — sufficient for a UX-layer PIN (not a cryptographic boundary)
  let h=0x811c9dc5;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}
  return h.toString(16).padStart(8,'0')+'|'+s.length;
}
function genKey(){
  const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a=Array.from({length:8},()=>ch[Math.floor(Math.random()*ch.length)]);
  return a[0]+a[1]+a[2]+'-'+a[3]+a[4]+a[5]+'-'+a[6]+a[7];
}

function requirePin(action){
  if(!S.pinHash){action();return;}
  _pinAction=action;
  openModal(`<div class="modal-header"><span class="modal-title">🔒 PIN Required</span><button class="btn btn-icon bs" onclick="closeModal()">${IC.close}</button></div>
    <div class="modal-body" style="text-align:center;padding:24px 20px">
      <div style="font-size:13px;color:var(--txt2);margin-bottom:16px">Enter your PIN to continue</div>
      <input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"
        style="text-align:center;font-size:28px;letter-spacing:8px;width:160px;padding:10px;background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--radius-sm);color:var(--txt)"
        onkeydown="if(event.key==='Enter')submitPin()">
      <div id="pin-err" style="color:var(--red);font-size:12px;margin-top:8px;min-height:18px"></div>
      <div style="margin-top:16px"><button class="btn bp" onclick="submitPin()" style="width:120px">Confirm</button></div>
      <button onclick="showRecovery()" style="background:none;border:none;color:var(--acc);font-size:12px;cursor:pointer;margin-top:18px;text-decoration:underline">Forgot PIN? Use recovery key</button>
    </div>`);
  setTimeout(()=>document.getElementById('pin-input')?.focus(),100);
}

function submitPin(){
  const v=(document.getElementById('pin-input')?.value||'').trim();
  if(!v){document.getElementById('pin-err').textContent='Enter your PIN';return;}
  if(hashStr(v)===S.pinHash){
    closeModal();
    const a=_pinAction;_pinAction=null;
    if(a)a();
  }else{
    document.getElementById('pin-err').textContent='Incorrect PIN — try again';
    document.getElementById('pin-input').value='';
    document.getElementById('pin-input').focus();
  }
}

function showRecovery(){
  document.querySelector('#modal-inner .modal-body').innerHTML=`
    <div style="text-align:center;padding:8px 0">
      <div style="font-size:13px;color:var(--txt2);margin-bottom:16px">Enter your recovery key (format: XXX-XXX-XX)</div>
      <input id="rec-input" type="text" maxlength="11" placeholder="e.g. X4K-BQ7-R2"
        style="text-align:center;font-size:16px;letter-spacing:3px;width:200px;padding:10px;background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--radius-sm);color:var(--txt);text-transform:uppercase"
        oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')submitRecovery()">
      <div id="rec-err" style="color:var(--red);font-size:12px;margin-top:8px;min-height:18px"></div>
      <div style="margin-top:16px"><button class="btn bp" onclick="submitRecovery()" style="width:140px">Reset PIN</button></div>
      <div style="font-size:11px;color:var(--txt3);margin-top:14px">Resetting will remove your PIN.<br>You can set a new one in Settings.</div>
    </div>`;
  setTimeout(()=>document.getElementById('rec-input')?.focus(),50);
}

function submitRecovery(){
  const v=(document.getElementById('rec-input')?.value||'').trim().toUpperCase().replace(/-/g,'');
  const keyCleaned=v.slice(0,3)+'-'+v.slice(3,6)+'-'+v.slice(6);
  if(hashStr(keyCleaned)===S.pinRecovery){
    S.pinHash=null;S.pinRecovery=null;save();
    closeModal();_pinAction=null;
    toast('PIN removed — set a new one in Settings','s');
    if(S.view==='settings')renderContent();
  }else{
    document.getElementById('rec-err').textContent='Invalid recovery key';
  }
}

function openSetPin(){
  const isChange=!!S.pinHash;
  let step=isChange?'verify':'new';
  let newPin='';

  function showStep(){
    const body=document.querySelector('#modal-inner .modal-body');
    if(!body)return;
    if(step==='verify'){
      body.innerHTML=`<div style="text-align:center;padding:8px 0">
        <div style="font-size:13px;color:var(--txt2);margin-bottom:16px">Enter your current PIN to continue</div>
        <input id="pin-cur" type="password" inputmode="numeric" maxlength="6" placeholder="Current PIN"
          style="text-align:center;font-size:24px;letter-spacing:6px;width:160px;padding:10px;background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--radius-sm);color:var(--txt)"
          onkeydown="if(event.key==='Enter')_pinVerifyCur()">
        <div id="pv-err" style="color:var(--red);font-size:12px;margin-top:8px;min-height:18px"></div>
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:center">
          <button class="btn bs" onclick="closeModal()">Cancel</button>
          <button class="btn bp" onclick="_pinVerifyCur()">Next</button>
        </div></div>`;
      setTimeout(()=>document.getElementById('pin-cur')?.focus(),50);
    } else if(step==='new'){
      body.innerHTML=`<div style="text-align:center;padding:8px 0">
        <div style="font-size:13px;color:var(--txt2);margin-bottom:16px">Choose a 4–6 digit PIN</div>
        <input id="pin-new" type="password" inputmode="numeric" maxlength="6" placeholder="New PIN"
          style="text-align:center;font-size:24px;letter-spacing:6px;width:160px;padding:10px;background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--radius-sm);color:var(--txt)"
          onkeydown="if(event.key==='Enter')_pinConfirmStep()">
        <div id="pn-err" style="color:var(--red);font-size:12px;margin-top:8px;min-height:18px"></div>
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:center">
          <button class="btn bs" onclick="closeModal()">Cancel</button>
          <button class="btn bp" onclick="_pinConfirmStep()">Next</button>
        </div></div>`;
      setTimeout(()=>document.getElementById('pin-new')?.focus(),50);
    } else if(step==='confirm'){
      body.innerHTML=`<div style="text-align:center;padding:8px 0">
        <div style="font-size:13px;color:var(--txt2);margin-bottom:16px">Confirm your PIN</div>
        <input id="pin-cfm" type="password" inputmode="numeric" maxlength="6" placeholder="Confirm PIN"
          style="text-align:center;font-size:24px;letter-spacing:6px;width:160px;padding:10px;background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--radius-sm);color:var(--txt)"
          onkeydown="if(event.key==='Enter')_pinSave()">
        <div id="pc-err" style="color:var(--red);font-size:12px;margin-top:8px;min-height:18px"></div>
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:center">
          <button class="btn bs" onclick="closeModal()">Cancel</button>
          <button class="btn bp" onclick="_pinSave()">Set PIN</button>
        </div></div>`;
      setTimeout(()=>document.getElementById('pin-cfm')?.focus(),50);
    }
  }

  window._pinVerifyCur=function(){
    const v=(document.getElementById('pin-cur')?.value||'').trim();
    if(hashStr(v)===S.pinHash){step='new';showStep();}
    else{document.getElementById('pv-err').textContent='Incorrect PIN';}
  };
  window._pinConfirmStep=function(){
    const v=(document.getElementById('pin-new')?.value||'').trim();
    if(v.length<4){document.getElementById('pn-err').textContent='PIN must be 4–6 digits';return;}
    if(!/^\d+$/.test(v)){document.getElementById('pn-err').textContent='Digits only';return;}
    newPin=v;step='confirm';showStep();
  };
  window._pinSave=function(){
    const v=(document.getElementById('pin-cfm')?.value||'').trim();
    if(v!==newPin){document.getElementById('pc-err').textContent='PINs do not match';return;}
    const key=genKey();
    S.pinHash=hashStr(newPin);S.pinRecovery=hashStr(key);save();
    const body=document.querySelector('#modal-inner .modal-body');
    body.innerHTML=`<div style="text-align:center;padding:8px 0">
      <div style="font-size:16px;font-weight:700;color:var(--green);margin-bottom:8px">PIN Set!</div>
      <div style="font-size:13px;color:var(--txt2);margin-bottom:20px">Write down your recovery key and keep it safe.<br>It cannot be shown again.</div>
      <div style="font-size:26px;font-weight:700;letter-spacing:4px;color:var(--txt);background:var(--surf2);border:2px dashed var(--bdr);border-radius:var(--radius);padding:14px 24px;display:inline-block;margin-bottom:16px">${esc(key)}</div>
      <div style="font-size:11px;color:var(--red);margin-bottom:20px">⚠️ Store this somewhere safe — you will need it to reset a forgotten PIN.</div>
      <button class="btn bp" onclick="closeModal();if(S.view==='settings')renderContent();" style="width:120px">Done</button>
    </div>`;
    if(S.view==='settings')setTimeout(()=>renderContent&&null,0);
  };

  openModal(`<div class="modal-header"><span class="modal-title">${isChange?'Change':'Set'} PIN</span><button class="btn btn-icon bs" onclick="closeModal()">${IC.close}</button></div>
    <div class="modal-body"></div>`);
  showStep();
}

function openRemovePin(){
  requirePin(()=>{
    S.pinHash=null;S.pinRecovery=null;save();
    toast('PIN removed','s');
    if(S.view==='settings')renderContent();
  });
}

function load(){
  try{
    const d=localStorage.getItem(STORE);
    if(d){const p=JSON.parse(d);S={...S,...p};if(!S.categories||!S.categories.length)S.categories=[...DEF_EXP,...DEF_INC];}
    // Always start on Dashboard regardless of last saved view
    S.view='dash';S.pid=null;S.selectedAccount=null;
  }catch(e){logErr('LOAD',e.message,e.stack||'');toast('Warning: saved data could not be loaded. Starting fresh.','w');}
  applyTheme();
}
function save(){
  try{localStorage.setItem(STORE,JSON.stringify(S));}
  catch(e){
    logErr('SAVE',e.message,e.stack||'');
    if(e.name==='QuotaExceededError'||e.code===22){toast('Storage full — remove some receipts to free space','e');}
    else{toast('Save failed: '+e.message,'e');}
  }
}
// HTML escape — prevents XSS when rendering user-supplied data into innerHTML
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function escNL(s){return esc(s).replace(/\n/g,'<br>');}
function applyTheme(){const t=S.theme==='system'?(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):S.theme;document.documentElement.setAttribute('data-theme',t==='light'?'light':'');}

const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const today=()=>new Date().toISOString().slice(0,10);

const getCat=id=>S.categories.find(c=>c.id===id)||{name:'Unknown',icon:CICONS.tag,color:'#6b7280'};
// Render a category icon — handles SVG strings and base64 image data
function catIconHtml(icon){
  if(!icon)return CICONS.tag;
  if(icon.startsWith('data:'))return`<img src="${icon}" style="width:20px;height:20px;object-fit:contain">`;
  return icon; // SVG string
}
const getAcc=id=>S.accounts.find(a=>a.id===id);

function accBal(acc){
  let b=Number(acc.openingBalance||0);
  S.projects.forEach(p=>(p.transactions||[]).forEach(t=>{
    if(t.accountId===acc.id){if(t.type==='income')b+=Number(t.amount||0);else if(t.type==='expense')b-=Number(t.amount||0);}
  }));
  return b;
}

function filterByPeriod(txs){
  if(S.periodFilter==='all'&&!S.periodMonth)return txs;
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  return txs.filter(t=>{
    if(!t.date)return false;
    const d=new Date(t.date+'T00:00:00');
    if(isNaN(d.getTime()))return false;
    if(S.periodMonth){const[py,pm]=S.periodMonth.split('-').map(Number);return d.getFullYear()===py&&d.getMonth()===pm-1;}
    switch(S.periodFilter){
      case'today':return t.date===today();
      case'yesterday':{const y2=new Date();y2.setDate(y2.getDate()-1);return t.date===y2.toISOString().slice(0,10);}
      case'week':{const s=new Date(now);s.setDate(now.getDate()-now.getDay());s.setHours(0,0,0,0);return d>=s;}
      case'lastweek':{const s=new Date(now);s.setDate(now.getDate()-now.getDay()-7);s.setHours(0,0,0,0);const e=new Date(s);e.setDate(s.getDate()+6);e.setHours(23,59,59);return d>=s&&d<=e;}
      case'month':return d.getFullYear()===y&&d.getMonth()===m;
      case'lastmonth':{const lm=m===0?11:m-1,ly=m===0?y-1:y;return d.getFullYear()===ly&&d.getMonth()===lm;}
      default:return true;
    }
  });
}

function allTxs(accId){
  let r=[];
  S.projects.forEach(p=>(p.transactions||[]).forEach(t=>{if(!accId||t.accountId===accId)r.push({...t,projectName:p.name,projectId:p.id});}));
  return r.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}

function getMonths(txs){const m=new Set();txs.forEach(t=>{if(t.date)m.add(t.date.slice(0,7));});return[...m].sort().reverse();}

// TOAST
function toast(msg,type='i'){
  const el=document.createElement('div');el.className=`toast toast-${type}`;
  el.innerHTML=`<span>${{s:'✓',e:'✕',i:'ℹ',w:'⚠'}[type]||'ℹ'}</span><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.cssText='opacity:0;transform:translateX(30px);transition:all 300ms';setTimeout(()=>el.remove(),300);},2800);
}

  ov.innerHTML=`<div class="search-box"><div class="search-input-wrap">${IC.search}<input id="search-q" placeholder="Search transactions, projects, staff, accounts…" autocomplete="off"></div><div class="search-results" id="search-results"><div class="search-empty">Start typing to search…</div></div></div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)closeSearch();});
  document.body.appendChild(ov);
  const inp=document.getElementById('search-q');
  inp.addEventListener('input',()=>doSearch(inp.value.trim()));
  inp.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();});
  inp.focus();
}
function closeSearch(){const ov=document.getElementById('search-overlay');if(ov)ov.remove();}

function doSearch(q){
  const res=document.getElementById('search-results');
  if(!q){res.innerHTML='<div class="search-empty">Start typing to search…</div>';return;}
  const lq=q.toLowerCase();
  const sections=[];

  // Transactions
  const txHits=[];
  S.projects.forEach(p=>(p.transactions||[]).forEach(t=>{
    const c=getCat(t.categoryId);
    const haystack=[t.payee,t.note,t.ref,t.inv,c.name,String(t.amount||''),p.name,...(t.tags||[])].join(' ').toLowerCase();
    if(haystack.includes(lq))txHits.push({t,p,c});
  }));
  if(txHits.length){
    sections.push(`<div class="search-group-label">Transactions (${txHits.length})</div>`);
    txHits.slice(0,8).forEach(({t,p,c})=>{
      sections.push(`<div class="search-result" onclick="closeSearch();openEditTx('${t.id}','${p.id}')">
        <div class="search-result-icon" style="color:var(--txt2)">${catIconHtml(c.icon)}</div>
        <div style="flex:1;min-width:0">
          <div class="search-result-name">${esc(t.payee||c.name)}${t.ref?` <span style="font-weight:400;color:var(--txt3)">#${esc(t.ref)}</span>`:''}</div>
          <div class="search-result-sub">${fmtDate(t.date)} · ${esc(p.name)} · ${c.name}</div>
        </div>
        <div class="search-result-badge" style="color:${t.type==='income'?'var(--green)':'var(--red)'}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div>
      </div>`);
    });
  }

  // Projects
  const projHits=S.projects.filter(p=>[p.name,p.agency,p.client,p.description].join(' ').toLowerCase().includes(lq));
  if(projHits.length){
    sections.push(`<div class="search-group-label">Projects (${projHits.length})</div>`);
    projHits.slice(0,5).forEach(p=>{
      sections.push(`<div class="search-result" onclick="closeSearch();openProj('${p.id}')">
        <div class="search-result-icon">${IC.proj}</div>
        <div style="flex:1;min-width:0">
          <div class="search-result-name">${esc(p.name)}</div>
          <div class="search-result-sub">${esc(p.agency||p.client||'—')}</div>
        </div>
        <div class="search-result-badge">${esc(p.status||'active')}</div>
      </div>`);
    });
  }

  // Staff
  const staffHits=S.staff.filter(s=>[s.name,s.role,s.phone,s.staffType].join(' ').toLowerCase().includes(lq));
  if(staffHits.length){
    sections.push(`<div class="search-group-label">Staff (${staffHits.length})</div>`);
    staffHits.slice(0,5).forEach(s=>{
      sections.push(`<div class="search-result" onclick="closeSearch();nav('staff')">
        <div class="search-result-icon">${IC.staff}</div>
        <div style="flex:1;min-width:0">
          <div class="search-result-name">${esc(s.name)}</div>
          <div class="search-result-sub">${esc(s.role||'—')}${s.phone?' · '+esc(s.phone):''}</div>
        </div>
        ${s.staffType?`<div class="search-result-badge">${esc(s.staffType)}</div>`:''}
      </div>`);
    });
  }

  // Accounts
  const accHits=S.accounts.filter(a=>[a.name,a.currency].join(' ').toLowerCase().includes(lq));
  if(accHits.length){
    sections.push(`<div class="search-group-label">Accounts (${accHits.length})</div>`);
    accHits.slice(0,4).forEach(a=>{
      const b=accBal(a);
      sections.push(`<div class="search-result" onclick="closeSearch();viewAcc('${a.id}')">
        <div class="search-result-icon">${a.icon||'🏦'}</div>
        <div style="flex:1;min-width:0">
          <div class="search-result-name">${esc(a.name)}</div>
          <div class="search-result-sub">${esc(a.currency||'JMD')}</div>
        </div>
        <div class="search-result-badge" style="color:${b>=0?'var(--green)':'var(--red)'}">${fmt(b,a.currency)}</div>
      </div>`);
    });
  }

  // Categories
  const catHits=S.categories.filter(c=>c.name.toLowerCase().includes(lq));
  if(catHits.length){
    sections.push(`<div class="search-group-label">Categories (${catHits.length})</div>`);
    catHits.slice(0,4).forEach(c=>{
      const count=S.projects.reduce((n,p)=>(p.transactions||[]).filter(t=>t.categoryId===c.id).length+n,0);
      sections.push(`<div class="search-result" onclick="closeSearch();nav('transactions')">
        <div class="search-result-icon">${c.icon}</div>
        <div style="flex:1;min-width:0">
          <div class="search-result-name">${esc(c.name)}</div>
          <div class="search-result-sub">${c.type} · ${count} transaction${count!==1?'s':''}</div>
        </div>
      </div>`);
    });
  }

  res.innerHTML=sections.length?sections.join(''):`<div class="search-empty">No results for "<strong>${esc(q)}</strong>"</div>`;
}

function renderContent(){
  const el=document.getElementById('content');
  if(S.pid){renderProject(el);return;}
  switch(S.view){
    case'dash':renderDash(el);break;
    case'projects':renderProjects(el);break;

    case'reports':renderReports(el);break;
    case'staff':renderStaffView(el);break;
    case'settings':renderSettings(el);break;

  }
}

function dashCharts(txs){
  if(!txs.length)return'';

  // --- LINE CHART: all months with data ---
  const monthMap={};
  txs.forEach(t=>{
    if(!t.date)return;
    const k=t.date.slice(0,7);
    if(!monthMap[k])monthMap[k]={key:k,inc:0,exp:0};
    if(t.type==='income')monthMap[k].inc+=Number(t.amount||0);
    else if(t.type==='expense')monthMap[k].exp+=Number(t.amount||0);
  });
  const months=Object.values(monthMap).sort((a,b)=>a.key.localeCompare(b.key));
  // Fill in gaps between first and last month
  if(months.length>1){
    const first=months[0].key,last=months[months.length-1].key;
    let[fy,fm]=[parseInt(first.slice(0,4)),parseInt(first.slice(5,7))];
    const[ly,lm]=[parseInt(last.slice(0,4)),parseInt(last.slice(5,7))];
    const full=[];
    while(fy<ly||(fy===ly&&fm<=lm)){
      const k=`${fy}-${String(fm).padStart(2,'0')}`;
      full.push(monthMap[k]||{key:k,inc:0,exp:0});
      fm++;if(fm>12){fm=1;fy++;}
    }
    months.length=0;months.push(...full);
  }
  const n=months.length;
  const colW=Math.max(36,Math.min(60,Math.floor(600/n)));
  const W=Math.max(480,n*colW+40),H=160,padL=36,padB=28,padT=20;
  const chartW=W-padL-8,chartH=H-padB-padT;
  const maxVal=Math.max(...months.map(m=>Math.max(m.inc,m.exp)),1);
  function fmtK(v){return v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'K':v.toFixed(0);}
  const yTicks=4;
  let yLines='';
  for(let i=0;i<=yTicks;i++){
    const yv=maxVal*(i/yTicks),yp=padT+chartH*(1-i/yTicks);
    yLines+=`<line x1="${padL}" y1="${yp}" x2="${W-8}" y2="${yp}" stroke="var(--bdr)" stroke-width="0.5"/>`;
    yLines+=`<text x="${padL-4}" y="${yp+3}" text-anchor="end" fill="var(--txt3)" font-size="9">${fmtK(yv)}</text>`;
  }
  const px=i=>padL+i*(chartW/(Math.max(n-1,1)))+colW/2-colW/2;
  const py=v=>padT+chartH*(1-v/maxVal);
  const incPts=months.map((m,i)=>`${px(i)},${py(m.inc)}`).join(' ');
  const expPts=months.map((m,i)=>`${px(i)},${py(m.exp)}`).join(' ');
  const dots=months.map((m,i)=>{
    const d=new Date(m.key+'-01');
    const label=d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
    return`<text x="${px(i)}" y="${H-8}" text-anchor="middle" fill="var(--txt3)" font-size="8">${label}</text>
      <circle cx="${px(i)}" cy="${py(m.inc)}" r="3" fill="#22c55e" opacity="${m.inc?'1':'0'}"/>
      <circle cx="${px(i)}" cy="${py(m.exp)}" r="3" fill="#ef4444" opacity="${m.exp?'1':'0'}"/>`;
  }).join('');
  const lineChart=`<div style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch">
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;min-width:${W}px">
      ${yLines}
      <polyline points="${incPts}" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <polyline points="${expPts}" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      <g transform="translate(${padL},10)">
        <circle cx="0" cy="0" r="4" fill="#22c55e"/>
        <text x="8" y="4" fill="var(--txt2)" font-size="9" font-weight="600">Income</text>
        <circle cx="60" cy="0" r="4" fill="#ef4444"/>
        <text x="68" y="4" fill="var(--txt2)" font-size="9" font-weight="600">Expenses</text>
      </g>
    </svg>
  </div>`;

  // --- DONUT CHART: expenses by category ---
  const catTotals={};
  txs.filter(t=>t.type==='expense').forEach(t=>{
    const cid=t.categoryId||'c14';
    catTotals[cid]=(catTotals[cid]||0)+Number(t.amount||0);
  });
  const totalExp=Object.values(catTotals).reduce((s,v)=>s+v,0)||1;
  const catGroups=Object.entries(catTotals)
    .map(([id,amount])=>{const c=getCat(id);return{id,name:c.name,amount,color:c.color,icon:c.icon};})
    .filter(g=>g.amount>0)
    .sort((a,b)=>b.amount-a.amount);
  const topCats=catGroups.slice(0,8);
  if(catGroups.length>8){
    const rest=catGroups.slice(8).reduce((s,g)=>s+g.amount,0);
    if(rest>0)topCats.push({name:'Other',amount:rest,color:'#6b7280',icon:CICONS.tag});
  }
  const donut=buildDonut(topCats,totalExp);
  const legend=topCats.map(g=>{
    const pct=Math.round(g.amount/totalExp*100);
    return`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
      <div style="width:10px;height:10px;border-radius:50%;background:${g.color};flex-shrink:0"></div>
      <span style="font-size:11px;color:var(--txt2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.name)}</span>
      <span style="font-size:11px;color:var(--txt3);flex-shrink:0">${pct}%</span>
      <span style="font-size:11px;font-weight:600;color:var(--txt);flex-shrink:0;min-width:70px;text-align:right">${fmt(g.amount)}</span>
    </div>`;
  }).join('');

  return`<div class="grid2" style="margin-bottom:20px">
    <div class="card"><div class="sec-hdr"><span class="sec-title">Income vs Expenses — All Time</span><span style="font-size:11px;color:var(--txt3)">${n} months</span></div>${lineChart}</div>
    <div class="card"><div class="sec-hdr"><span class="sec-title">Expenses by Category</span></div>
      <div style="display:flex;gap:16px;align-items:flex-start">
        <div style="flex-shrink:0">${donut}</div>
        <div style="flex:1;min-width:0;max-height:160px;overflow-y:auto">${legend}</div>
      </div>
    </div>
  </div>`;
}

function buildDonut(groups,total){
  if(!total||!groups.length)return'';
  const r=44,ir=26,cx=60,cy=60;
  const nonZero=groups.filter(g=>g.amount>0);
  if(!nonZero.length)return'';
  if(nonZero.length===1){
    return`<svg width="120" height="120" viewBox="0 0 120 120" style="flex-shrink:0">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${nonZero[0].color}" stroke-width="${r-ir}"/>
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="var(--txt)" font-size="10" font-weight="700">100%</text>
    </svg>`;
  }
  let paths='',off=-Math.PI/2;
  nonZero.forEach(g=>{
    const pct=g.amount/total,a=pct*2*Math.PI;
    if(a<0.001)return;
    const x1=cx+r*Math.cos(off),y1=cy+r*Math.sin(off);
    const x2=cx+r*Math.cos(off+a),y2=cy+r*Math.sin(off+a);
    const xi1=cx+ir*Math.cos(off),yi1=cy+ir*Math.sin(off);
    const xi2=cx+ir*Math.cos(off+a),yi2=cy+ir*Math.sin(off+a);
    const lg=a>Math.PI?1:0;
    paths+=`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${lg} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${xi2.toFixed(2)} ${yi2.toFixed(2)} A${ir} ${ir} 0 ${lg} 0 ${xi1.toFixed(2)} ${yi1.toFixed(2)}Z" fill="${g.color}" opacity=".88" stroke="var(--surf)" stroke-width="1.5"/>`;
    off+=a;
  });
  const topPct=Math.round(nonZero[0].amount/total*100);
  return`<svg width="120" height="120" viewBox="0 0 120 120" style="flex-shrink:0">
    ${paths}
    <text x="${cx}" y="${cy-5}" text-anchor="middle" dominant-baseline="middle" fill="var(--txt)" font-size="13" font-weight="700">${topPct}%</text>
    <text x="${cx}" y="${cy+10}" text-anchor="middle" fill="var(--txt3)" font-size="8">${esc(nonZero[0].name.length>10?nonZero[0].name.slice(0,9)+'…':nonZero[0].name)}</text>
  </svg>`;
}

function buildSimplePie(groups,total){
  if(!total)return'<svg width="120" height="120"></svg>';
  const r=50,cx=60,cy=60;
  // Filter zero-amount slices
  const nonZero=groups.filter(g=>g.amount>0);
  if(!nonZero.length)return'<svg width="120" height="120"></svg>';
  // If only one slice, draw a full circle instead of an arc
  if(nonZero.length===1){
    return`<svg width="120" height="120" viewBox="0 0 120 120" style="flex-shrink:0"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${nonZero[0].color}" opacity=".9"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="11" font-weight="700">100%</text></svg>`;
  }
  let paths='',off=0;
  nonZero.forEach(g=>{
    const pct=g.amount/total,a=pct*2*Math.PI;
    if(a<0.001)return;
    const x1=cx+r*Math.sin(off),y1=cy-r*Math.cos(off);
    const x2=cx+r*Math.sin(off+a),y2=cy-r*Math.cos(off+a);
    const lg=pct>.5?1:0;
    paths+=`<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${lg} 1 ${x2} ${y2}Z" fill="${g.color}" opacity=".9"/>`;
    if(pct>.08){const la=off+a/2,lx=cx+r*.62*Math.sin(la),ly=cy-r*.62*Math.cos(la);paths+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="11" font-weight="700">${Math.round(pct*100)}%</text>`;}
    off+=a;
  });
  return`<svg width="120" height="120" viewBox="0 0 120 120" style="flex-shrink:0">${paths}</svg>`;
}

function buildDonut(groups,total,typeColor){
  if(!total)return'<svg width="200" height="200"></svg>';
  const r=80,cx=100,cy=100,hole=50;
  const shades=typeColor==='income'?['#22c55e','#16a34a','#15803d','#4ade80','#86efac','#bbf7d0','#dcfce7','#f0fdf4','#14532d','#166534','#065f46','#064e3b']:['#ef4444','#dc2626','#b91c1c','#f87171','#fca5a5','#fecaca','#fee2e2','#fef2f2','#7f1d1d','#991b1b','#450a0a','#5c0404'];
  const nonZero=groups.filter(g=>g.amount>0).slice(0,12);
  // Single slice: draw full donut ring
  if(nonZero.length===1){
    const col=shades[0];
    return`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M${cx} ${cy-r} A${r} ${r} 0 1 1 ${cx-.01} ${cy-r} Z" fill="${col}"/><circle cx="${cx}" cy="${cy}" r="${hole}" fill="var(--bg)"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="10" font-weight="700">100%</text></svg>`;
  }
  let paths='',off=0;
  nonZero.forEach((g,idx)=>{
    const pct=g.amount/total,a=pct*2*Math.PI;
    if(a<0.001)return;
    const x1=cx+r*Math.sin(off),y1=cy-r*Math.cos(off),x2=cx+r*Math.sin(off+a),y2=cy-r*Math.cos(off+a);
    const xi1=cx+hole*Math.sin(off),yi1=cy-hole*Math.cos(off),xi2=cx+hole*Math.sin(off+a),yi2=cy-hole*Math.cos(off+a);
    const lg=pct>.5?1:0;
    const col=shades[idx%shades.length];
    paths+=`<path d="M${xi1} ${yi1} L${x1} ${y1} A${r} ${r} 0 ${lg} 1 ${x2} ${y2} L${xi2} ${yi2} A${hole} ${hole} 0 ${lg} 0 ${xi1} ${yi1}Z" fill="${col}"><title>${esc(g.label)}: ${fmt(g.amount)} (${Math.round(pct*100)}%)</title></path>`;
    if(pct>.06){const la=off+a/2,lx=cx+r*.68*Math.sin(la),ly=cy-r*.68*Math.cos(la);paths+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="10" font-weight="700">${Math.round(pct*100)}%</text>`;}
    off+=a;
  });
  return`<svg width="200" height="200" viewBox="0 0 200 200">${paths}</svg>`;
}

function buildBar(groups,total,typeColor){
  if(!total)return'<svg width="200" height="160"></svg>';
  const items=groups.slice(0,8),bh=16,gap=8,pad=4,h=items.length*(bh+gap)+pad*2;
  const col=typeColor==='income'?'#22c55e':'#ef4444';
  let bars='';
  items.forEach((g,i)=>{const bw=Math.max(2,Math.round(g.amount/total*160)),y=pad+i*(bh+gap);const opacity=1-i*0.07;bars+=`<rect x="0" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${col}" opacity="${opacity.toFixed(2)}"/><text x="${bw+4}" y="${y+bh/2}" dominant-baseline="middle" fill="var(--txt2)" font-size="10">${Math.round(g.amount/total*100)}%</text>`;});
  return`<svg width="200" height="${h}" viewBox="0 0 200 ${h}">${bars}</svg>`;
}

function saveProj(editId){
  const name=document.getElementById('pn').value.trim();if(!name){toast('Name required','e');return;}
  const staffSel=[...document.querySelectorAll('input[name="pstaff"]:checked')].map(e=>e.value);
  const proj={id:editId||uid(),name,agency:document.getElementById('pa').value.trim(),contractType:document.getElementById('pct').value,contractValue:document.getElementById('pcv').value,startDate:document.getElementById('ps').value,endDate:document.getElementById('pe').value,location:document.getElementById('ploc').value.trim(),accountId:document.getElementById('pac').value,wageType:document.getElementById('pwt').value,wageAmount:document.getElementById('pwa').value,notes:document.getElementById('pno').value.trim(),transactions:[],lostDays:[],variations:[],assignedStaff:staffSel,planGoals:[],planBudgets:[],createdAt:new Date().toISOString()};
  if(editId){
    const idx=S.projects.findIndex(p=>p.id===editId);
    if(idx<0){toast('Project not found','e');return;}
    const o=S.projects[idx];
    proj.transactions=o.transactions;proj.lostDays=o.lostDays;proj.variations=o.variations;
    // staffSel comes from checkboxes — keep it (don't revert to old)
    proj.planGoals=o.planGoals||[];proj.planBudgets=o.planBudgets||[];proj.createdAt=o.createdAt;
    S.projects[idx]=proj;toast('Updated','s');
  }else{S.projects.push(proj);toast('Project created','s');}
  save();closeModal();render();
}
function delProj(id){S.projects=S.projects.filter(p=>p.id!==id);S.pid=null;save();closeModal();toast('Deleted','s');render();}

function saveTx(editId,editPid){
  const amt=document.getElementById('txamt').value;if(!amt||Number(amt)<=0){toast('Amount required','e');return;}
  const type=document.getElementById('modal-inner').dataset.tt||'expense';
  const pid=document.getElementById('txproj').value;if(!pid){toast('Select a project','e');return;}
  const p=getProj(pid);if(!p){toast('Project not found','e');return;}
  const rFile=document.getElementById('txreceipt')?.files?.[0];
  function doSave(receipt,rName){
    const existTx=editId&&getProj(pid)?.transactions.find(t=>t.id===editId);
    const tx={id:editId||uid(),type,amount:Number(amt),categoryId:document.getElementById('txcid').value,accountId:document.getElementById('txacc').value,projectId:pid,date:document.getElementById('txdate').value||today(),ref:document.getElementById('txref').value.trim(),inv:document.getElementById('txinv').value.trim(),payee:document.getElementById('txpayee').value.trim(),tags:document.getElementById('txtags').value.split(',').map(t=>t.trim()).filter(Boolean),note:document.getElementById('txnote').value.trim(),receipt:receipt||(existTx?.receipt||null),receiptName:rName||(existTx?.receiptName||null),createdAt:new Date().toISOString()};
    if(editId){if(editPid&&editPid!==pid){const op=getProj(editPid);if(op)op.transactions=op.transactions.filter(t=>t.id!==editId);}const idx=p.transactions.findIndex(t=>t.id===editId);if(idx>=0)p.transactions[idx]=tx;else p.transactions.push(tx);toast('Updated','s');}
    else{p.transactions.push(tx);toast('Saved','s');}
    save();closeModal();render();
  }
  if(rFile){
    if(rFile.size>4*1024*1024){toast('Receipt must be under 4 MB','e');return;}
    const rd=new FileReader();rd.onload=e=>doSave(e.target.result,rFile.name);rd.readAsDataURL(rFile);
  }
  else doSave(null,null);
}

      <label class="toggle" style="margin-top:10px"><input type="checkbox" id="eph" checked><div class="toggle-track"></div><span style="font-size:13px">Include header row</span></label>
    </div>
    <div class="modal-footer"><button class="btn bs" onclick="closeModal()">Cancel</button><button class="btn bp" onclick="doExport()">${IC.dl} Export CSV</button></div>`,'modal-lg');

function doExport(){
  const per=document.getElementById('epp').value,accSel=document.getElementById('epa').value,projSel=document.getElementById('epp2').value;
  const cols=[...document.querySelectorAll('.export-col.selected')].map(e=>e.dataset.col);
  if(!cols.length){toast('Select columns','w');return;}
  let txs=allTxs(accSel||null);if(projSel)txs=txs.filter(t=>t.projectId===projSel);
  const now=new Date();
  if(per==='month')txs=txs.filter(t=>{const d=new Date(t.date+'T00:00:00');return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
  else if(per==='lastmonth')txs=txs.filter(t=>{const d=new Date(t.date+'T00:00:00'),lm=now.getMonth()===0?11:now.getMonth()-1,ly=now.getMonth()===0?now.getFullYear()-1:now.getFullYear();return d.getFullYear()===ly&&d.getMonth()===lm;});
  else if(per==='year')txs=txs.filter(t=>new Date(t.date+'T00:00:00').getFullYear()===now.getFullYear());
  const rows=txs.map(t=>{const cat=getCat(t.categoryId),acc=getAcc(t.accountId),proj=getProj(t.projectId);const map={Date:t.date,Type:t.type,Category:cat.name,Payee:t.payee||'',Account:acc?acc.name:'',Project:proj?proj.name:'',Amount:t.amount,Tags:(t.tags||[]).join(';'),Note:t.note||''};return cols.map(c=>`"${String(map[c]||'').replace(/"/g,'""')}"`).join(',');});
  if(document.getElementById('eph').checked)rows.unshift(cols.join(','));
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ContractMgmt_${per}_${today()}.csv`;a.click();
  closeModal();toast(`Exported ${txs.length} transactions`,'s');
}
function expJSON(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ContractMgmt_backup_${today()}.json`;a.click();toast('Exported','s');}
function clearAll(){confirm2('Delete ALL data permanently?',()=>{S.projects=[];S.staff=[];S.accounts=[];S.categories=[...DEF_EXP,...DEF_INC];save();toast('Cleared','w');render();},'Clear All','bd');}

// THEME
function setTheme(t){S.theme=t;applyTheme();save();renderSidebar();if(S.view==='settings')renderContent();}

// INIT
load();render();
</script>
